# Flyway Base Configuration — shared defaults across all environments
# Do NOT set flyway.url / flyway.user / flyway.password here.
# Those are injected at runtime via environment variables.

# History schema and table are injected at runtime via FLYWAY_DEFAULT_SCHEMA,
# FLYWAY_SCHEMAS, and FLYWAY_TABLE env vars (one Flyway run per schema+subfolder).
# These fallback values are never used when running through migrate.sh.
flyway.defaultSchema=flyway_history
flyway.schemas=flyway_history
flyway.table=schema_version

# Baseline — used when migrating a pre-existing database for the first time
flyway.baselineVersion=0
flyway.baselineDescription=Pre-Flyway baseline

# Validation
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true

# Safety
flyway.outOfOrder=false
flyway.mixed=false
flyway.cleanDisabled=true

# SQL migration file conventions
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.repeatableSqlMigrationPrefix=R
flyway.encoding=UTF-8
flyway.placeholderReplacement=false

# Connectivity
flyway.connectRetries=3
flyway.connectRetriesInterval=5
flyway.lockRetryCount=10
