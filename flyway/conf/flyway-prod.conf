# Flyway PROD Environment Configuration
# Most restrictive settings — never baseline, never clean.

flyway.outOfOrder=false
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
flyway.outputQueryResults=false

# Fail if pending migrations have already been applied out-of-band
flyway.validateOnMigrate=true
flyway.ignoreMigrationPatterns=
