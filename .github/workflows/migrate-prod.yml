name: Migrate — PROD (Manual + Restricted)

# Restrictions:
#   1. Manual trigger only
#   2. Must run from the main branch
#   3. Requires typing CONFIRM-PROD
#   4. Pauses for reviewer approval via GitHub Environments → production
#
# Configure: Repository → Settings → Environments → production
#   → Required reviewers (DBAs / tech leads)
#   → Deployment branches: main only
#
# DB credentials come from the "production" GitHub Environment secrets:
#   DB_HOST  DB_PORT  DB_NAME  DB_USER  DB_PASSWORD  GIT_TOKEN

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — strongly recommended before a live run"
        type: boolean
        default: true
      confirm:
        description: "Type CONFIRM-PROD to authorise a live production migration"
        required: true

env:
  FLYWAY_VERSION: "10.20.1"

jobs:
  guard:
    name: Branch & Confirmation Guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "ERROR: PROD migrations must be triggered from the main branch."
            echo "       Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Verify confirmation phrase
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "CONFIRM-PROD" ]]; then
            echo "ERROR: Type exactly CONFIRM-PROD in the confirmation field."
            exit 1
          fi

  validate:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    needs: guard
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml --quiet
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client git

      - name: Run validation
        run: |
          chmod +x scripts/validate.sh
          scripts/validate.sh --env prod
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GIT_TOKEN:   ${{ secrets.GIT_TOKEN }}

  migrate:
    name: Run Migration — PROD
    runs-on: ubuntu-latest
    needs: validate
    # Pauses here until a reviewer approves in GitHub Environments → production
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml --quiet
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client git

      - name: Cache Flyway binary
        uses: actions/cache@v4
        with:
          path: .flyway
          key: flyway-${{ env.FLYWAY_VERSION }}-linux-x64

      - name: Run migration
        run: |
          chmod +x scripts/migrate.sh scripts/detect-state.sh
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          scripts/migrate.sh --env prod $DRY
        env:
          FLYWAY_VERSION: ${{ env.FLYWAY_VERSION }}
          GITHUB_ACTOR:   ${{ github.actor }}
          DB_HOST:        ${{ secrets.DB_HOST }}
          DB_PORT:        ${{ secrets.DB_PORT }}
          DB_NAME:        ${{ secrets.DB_NAME }}
          DB_USER:        ${{ secrets.DB_USER }}
          DB_PASSWORD:    ${{ secrets.DB_PASSWORD }}
          GIT_TOKEN:      ${{ secrets.GIT_TOKEN }}

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log-prod-${{ github.run_number }}
          path: logs/
          retention-days: 365
