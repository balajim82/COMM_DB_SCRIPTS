name: Migrate — DEV (Auto)

# Triggers automatically on push to develop/* or feature/* branches.
# The DB credentials come from the "dev" GitHub Environment secrets:
#   DB_HOST  DB_PORT  DB_NAME  DB_USER  DB_PASSWORD  GIT_TOKEN
# The git repo URL for scripts is read from config/databases.yml.

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "config/databases.yml"
      - "flyway/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — show pending migrations without applying"
        type: boolean
        default: false

env:
  FLYWAY_VERSION: "10.20.1"

jobs:
  validate:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml --quiet
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client git

      - name: Run validation
        run: |
          chmod +x scripts/validate.sh
          scripts/validate.sh --env dev
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GIT_TOKEN:   ${{ secrets.GIT_TOKEN }}

  migrate:
    name: Run Migration — DEV
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml --quiet
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client git

      - name: Cache Flyway binary
        uses: actions/cache@v4
        with:
          path: .flyway
          key: flyway-${{ env.FLYWAY_VERSION }}-linux-x64

      - name: Run migration
        run: |
          chmod +x scripts/migrate.sh scripts/detect-state.sh
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          scripts/migrate.sh --env dev $DRY
        env:
          FLYWAY_VERSION: ${{ env.FLYWAY_VERSION }}
          GITHUB_ACTOR:   ${{ github.actor }}
          DB_HOST:        ${{ secrets.DB_HOST }}
          DB_PORT:        ${{ secrets.DB_PORT }}
          DB_NAME:        ${{ secrets.DB_NAME }}
          DB_USER:        ${{ secrets.DB_USER }}
          DB_PASSWORD:    ${{ secrets.DB_PASSWORD }}
          GIT_TOKEN:      ${{ secrets.GIT_TOKEN }}

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log-dev-${{ github.run_number }}
          path: logs/
          retention-days: 30
