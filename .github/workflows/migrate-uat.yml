name: Migrate — UAT (Manual Approval)

# Manual trigger only. Execution pauses at the migrate job until a reviewer
# approves in GitHub Environments → uat.
#
# Configure protection: Repository → Settings → Environments → uat
#   → Required reviewers (add QA lead / senior dev)
#
# DB credentials come from the "uat" GitHub Environment secrets:
#   DB_HOST  DB_PORT  DB_NAME  DB_USER  DB_PASSWORD  GIT_TOKEN

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — show pending migrations without applying"
        type: boolean
        default: false
      confirm:
        description: "Type CONFIRM to proceed"
        required: true

env:
  FLYWAY_VERSION: "10.20.1"

jobs:
  guard:
    name: Confirmation Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]]; then
            echo "ERROR: Type CONFIRM in the confirmation field to proceed."
            exit 1
          fi

  validate:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    needs: guard
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml --quiet
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client git

      - name: Run validation
        run: |
          chmod +x scripts/validate.sh
          scripts/validate.sh --env uat
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GIT_TOKEN:   ${{ secrets.GIT_TOKEN }}

  migrate:
    name: Run Migration — UAT
    runs-on: ubuntu-latest
    needs: validate
    # Pauses here until a reviewer approves in GitHub Environments → uat
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml --quiet
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client git

      - name: Cache Flyway binary
        uses: actions/cache@v4
        with:
          path: .flyway
          key: flyway-${{ env.FLYWAY_VERSION }}-linux-x64

      - name: Run migration
        run: |
          chmod +x scripts/migrate.sh scripts/detect-state.sh
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          scripts/migrate.sh --env uat $DRY
        env:
          FLYWAY_VERSION: ${{ env.FLYWAY_VERSION }}
          GITHUB_ACTOR:   ${{ github.actor }}
          DB_HOST:        ${{ secrets.DB_HOST }}
          DB_PORT:        ${{ secrets.DB_PORT }}
          DB_NAME:        ${{ secrets.DB_NAME }}
          DB_USER:        ${{ secrets.DB_USER }}
          DB_PASSWORD:    ${{ secrets.DB_PASSWORD }}
          GIT_TOKEN:      ${{ secrets.GIT_TOKEN }}

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log-uat-${{ github.run_number }}
          path: logs/
          retention-days: 90
